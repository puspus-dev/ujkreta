<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KRÁTA – Kétfaktoros azonosítás</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: #e8eef2;
      display: flex; flex-direction: column; align-items: center;
      padding: 32px 16px 48px;
      color: #1a1a1a;
    }
    .logo-wrap { text-align: center; margin-bottom: 20px; }
    .logo-wrap img { max-height: 56px; max-width: 180px; }
    .logo-text {
      font-size: 28px; font-weight: 800; letter-spacing: 0.12em;
      color: #1a3a4a; margin: 0;
    }
    .logo-sub { font-size: 11px; color: #5a6a7a; letter-spacing: 0.2em; margin-top: 2px; }

    .card {
      width: 100%; max-width: 420px;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      overflow: hidden;
    }
    .card-head {
      background: #0088a8;
      color: #fff;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 650;
    }
    .card-body { padding: 18px 20px 22px; }
    .hint {
      font-size: 14px; color: #333; margin: 0 0 18px; line-height: 1.45;
    }
    .otp-row {
      display: flex; align-items: center; gap: 10px;
      justify-content: center; margin-bottom: 18px;
    }
    .otp-icon {
      width: 36px; height: 36px; border-radius: 6px;
      background: #e8f4f8; display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    .otp-boxes {
      display: flex; gap: 6px;
    }
    .otp-boxes input {
      width: 40px; height: 44px;
      text-align: center; font-size: 20px; font-weight: 650;
      border: 1px solid #c5d0dc; border-radius: 4px;
      outline: none;
    }
    .otp-boxes input:focus {
      border-color: #0088a8;
      box-shadow: 0 0 0 2px rgba(0,136,168,.2);
    }
    .actions {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
    }
    .btn {
      min-height: 40px; padding: 8px 16px; font-size: 14px; font-weight: 600;
      border-radius: 3px; cursor: pointer; border: 1px solid #c5d0dc;
      background: #f5f7f9; color: #333;
    }
    .btn-primary {
      background: #0088a8; border-color: #0088a8; color: #fff;
    }
    .btn-primary:hover { background: #00718c; }
    .btn-primary:disabled { opacity: .55; cursor: not-allowed; }
    .link-row { font-size: 13px; color: #555; margin-bottom: 12px; }
    .link-row a { color: #0067b8; }
    .trust {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: #444; margin-top: 4px;
    }
    .err {
      display: none; margin-bottom: 12px; padding: 10px 12px;
      background: #ffebee; border: 1px solid #ef9a9a; color: #c62828;
      border-radius: 3px; font-size: 13px;
    }
    .err.show { display: block; }
    .recovery-panel {
      display: none; margin-top: 12px; padding-top: 12px;
      border-top: 1px solid #e0e6ea;
    }
    .recovery-panel.show { display: block; }
    .recovery-panel input {
      width: 100%; min-height: 42px; padding: 8px 10px;
      font-size: 15px; border: 1px solid #c5d0dc; border-radius: 3px;
      margin: 8px 0 12px;
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <img src="https://puspus-dev.github.io/ujkreta/src/logo.png" alt="KRÁTA"
         onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='block';" />
    <div id="logoFallback" style="display:none;">
      <p class="logo-text">KRÁTA</p>
      <div class="logo-sub">NAPLÓ</div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">Kétfaktoros azonosítás</div>
    <div class="card-body">
      <p class="hint">Kérjük, adja meg a hitelesítő alkalmazás által generált hatjegyű kódot!</p>
      <div class="err" id="errBox"></div>

      <div class="otp-row">
        <div class="otp-icon" title="Hitelesítő app">📱</div>
        <div class="otp-boxes" id="otpBoxes">
          <input inputmode="numeric" maxlength="1" aria-label="1" />
          <input inputmode="numeric" maxlength="1" aria-label="2" />
          <input inputmode="numeric" maxlength="1" aria-label="3" />
          <input inputmode="numeric" maxlength="1" aria-label="4" />
          <input inputmode="numeric" maxlength="1" aria-label="5" />
          <input inputmode="numeric" maxlength="1" aria-label="6" />
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn" id="btnCancel">Mégse</button>
        <button type="button" class="btn btn-primary" id="btnVerify">Kód ellenőrzése</button>
      </div>

      <div class="link-row">
        Nem fér hozzá készülékéhez?
        <a href="#" id="linkRecovery">Lépjen be helyreállító kóddal</a>
      </div>

      <div class="recovery-panel" id="recoveryPanel">
        <label for="recoveryInput"><strong>Helyreállító kód</strong></label>
        <input id="recoveryInput" autocomplete="one-time-code" placeholder="8 karakteres kód" />
        <button type="button" class="btn btn-primary" id="btnRecovery" style="width:100%;">Belépés helyreállító kóddal</button>
      </div>

      <label class="trust">
        <input type="checkbox" id="trustDevice" />
        Eszköz megjelölése biztonságosként
      </label>
    </div>
  </div>

  <script>
    const API_BASE = "https://ujkreta.onrender.com";
    const LOGIN_URL = "https://puspus-dev.github.io/ujkreta/";

    const mfaToken = sessionStorage.getItem("mfa_token") || "";
    if (!mfaToken) {
      window.location.href = LOGIN_URL;
    }

    const inputs = [...document.querySelectorAll("#otpBoxes input")];
    const errBox = document.getElementById("errBox");

    function showErr(msg) {
      errBox.textContent = msg || "";
      errBox.classList.toggle("show", !!msg);
    }

    function getCode() {
      return inputs.map((i) => i.value.replace(/\D/g, "")).join("");
    }

    inputs.forEach((inp, idx) => {
      inp.addEventListener("input", (e) => {
        const v = e.target.value.replace(/\D/g, "").slice(-1);
        e.target.value = v;
        if (v && idx < inputs.length - 1) inputs[idx + 1].focus();
        if (getCode().length === 6) verify(getCode());
      });
      inp.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !inp.value && idx > 0) {
          inputs[idx - 1].focus();
        }
      });
      inp.addEventListener("paste", (e) => {
        e.preventDefault();
        const t = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6);
        t.split("").forEach((ch, i) => { if (inputs[i]) inputs[i].value = ch; });
        if (t.length === 6) verify(t);
      });
    });

    function deviceToken() {
      let t = localStorage.getItem("krata_device_token");
      if (!t) {
        t = Array.from(crypto.getRandomValues(new Uint8Array(16)))
          .map((b) => b.toString(16).padStart(2, "0")).join("");
        localStorage.setItem("krata_device_token", t);
      }
      return t;
    }

    async function verify(code) {
      showErr("");
      const btn = document.getElementById("btnVerify");
      btn.disabled = true;
      try {
        const body = new URLSearchParams();
        body.set("mfa_token", mfaToken);
        body.set("code", code);
        body.set("device_token", deviceToken());
        if (document.getElementById("trustDevice").checked) {
          body.set("trust_device", "true");
        }
        const res = await fetch(API_BASE + "/connect/mfa/verify", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: body.toString()
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.error_description || data.error || "Hibás kód");
        }
        finishLogin(data);
      } catch (e) {
        showErr(e.message || String(e));
        inputs.forEach((i) => (i.value = ""));
        inputs[0].focus();
      } finally {
        btn.disabled = false;
      }
    }

    function finishLogin(data) {
      if (data.access_token) {
        localStorage.setItem("access_token", data.access_token);
        localStorage.setItem("ujkreta_access_token", data.access_token);
      }
      if (data.refresh_token) {
        localStorage.setItem("refresh_token", data.refresh_token);
      }
      if (data.device_token) {
        localStorage.setItem("krata_device_token", data.device_token);
      }
      let role = "Tanulo";
      try {
        if (data.id_token) {
          const payload = data.id_token.split(".")[1];
          const b64 = payload.replace(/-/g, "+").replace(/_/g, "/");
          const claims = JSON.parse(atob(b64 + "=".repeat((4 - b64.length % 4) % 4)));
          role = claims.role || role;
        }
      } catch (_) {}
      localStorage.setItem("ujkreta_role", role);
      sessionStorage.removeItem("mfa_token");

      const roleL = String(role).toLowerCase();
      if (roleL.indexOf("osztalyfonok") !== -1) {
        window.location.href = "https://puspus-dev.github.io/ujkreta/osztalyfonok/";
      } else if (roleL.indexOf("tanar") !== -1 || roleL === "teacher") {
        window.location.href = "https://puspus-dev.github.io/ujkreta/tanar/";
      } else {
        window.location.href = "https://puspus-dev.github.io/ujkreta/diak/";
      }
    }

    document.getElementById("btnVerify").onclick = () => {
      const c = getCode();
      if (c.length !== 6) { showErr("Add meg a 6 jegyű kódot."); return; }
      verify(c);
    };
    document.getElementById("btnCancel").onclick = () => {
      sessionStorage.removeItem("mfa_token");
      window.location.href = LOGIN_URL;
    };
    document.getElementById("linkRecovery").onclick = (e) => {
      e.preventDefault();
      document.getElementById("recoveryPanel").classList.toggle("show");
    };
    document.getElementById("btnRecovery").onclick = () => {
      const c = document.getElementById("recoveryInput").value.trim();
      if (!c) { showErr("Add meg a helyreállító kódot."); return; }
      verify(c);
    };

    inputs[0].focus();
  </script>
</body>
</html>
