<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <title>KRÁTA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/diak/style.css" />
</head>
<body>

  <header>
    <h1>KRÁTA - DIÁK</h1>
    <div class="login-box">
      <input id="username" type="text" placeholder="Felhasználónév">
      <input id="password" type="password" placeholder="Jelszó">
      <button id="loginBtn">Bejelentkezés</button>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Diák adatlap</h2>
      <div id="studentInfo">Nincs bejelentkezve.</div>
    </section>

    <section class="card">
      <h2>Értékelések</h2>
      <ul id="grades"></ul>
    </section>

    <section class="card">
      <h2>Órarend</h2>
      <ul id="timetable"></ul>
    </section>

    <section class="card">
      <h2>Házi feladatok</h2>
      <ul id="homework"></ul>
    </section>

    <section class="card">
      <h2>Feljegyzések</h2>
      <ul id="notes"></ul>
    </section>

    <section class="card">
      <h2>Mulasztások</h2>
      <ul id="absences"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
