<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KRÁTA – Iskolai Alaprendszer</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="bootMsg" class="boot-msg">Betöltés…</div>
  <div id="loginScreen" style="display:none;"></div>
  <div id="appShell" style="display:none;">
    <header class="main-header">
      <button type="button" class="menu-toggle" id="menuBtn" aria-label="Menü">☰</button>
      <a class="brand" href="./"><img src="krata-logo.png" alt="KRÁTA" /></a>
      <div class="school-title"><h3 id="instName">KRÁTA</h3><span id="tanev"></span></div>
      <div class="usermenu">
        <span class="username" id="userName">—</span>
        <span class="usercode" id="userCode"></span>
        <button type="button" class="k-logout" id="logoutBtn">Kijelentkezés</button>
      </div>
    </header>

    <nav class="main-menu" id="sidebar">
      <button type="button" class="k-nav-item active" data-page="dashboard"><img class="menu-ico" src="icons/Information_icon.png" alt="">Kezdőlap</button>
      <button type="button" class="k-nav-item" data-page="timetable"><img class="menu-ico" src="icons/sprite.png" alt="">Órarend</button>
      <button type="button" class="k-nav-item" data-page="grades"><img class="menu-ico" src="icons/note_text_f.png" alt="">Beírt jegyek</button>
      <button type="button" class="k-nav-item" data-page="absences"><img class="menu-ico" src="icons/icon_igazolt_hianyzas.png" alt="">Mulasztások</button>
      <button type="button" class="k-nav-item" data-page="notes"><img class="menu-ico" src="icons/note_text_p.png" alt="">Információk</button>
      <button type="button" class="k-nav-item" data-page="homework"><img class="menu-ico" src="icons/note_text_f.png" alt="">Házi feladatok</button>
      <button type="button" class="k-nav-item" data-page="messages"><img class="menu-ico" src="icons/ugyfelszolgalat_icon.png" alt="">e-Ügyintézés</button>
      <button type="button" class="k-nav-item" data-page="tests"><img class="menu-ico" src="icons/Hibajegy.png" alt="">Dolgozatok</button>
      <button type="button" class="k-nav-item" data-page="profile"><img class="menu-ico" src="icons/no_picture.png" alt="">Profil</button>
    </nav>

    <main class="main-content">
      <div id="pageContent"></div>
    </main>
  <nav class="m-bottom-nav" id="bottomNav">
    <button type="button" class="m-tab active" data-page="dashboard"><img class="m-ico-img" src="icons/Information_icon.png" alt=""><span>Faliújság</span></button>
    <button type="button" class="m-tab" data-page="grades"><img class="m-ico-img" src="icons/note_text_f.png" alt=""><span>Jegyek</span></button>
    <button type="button" class="m-tab" data-page="timetable"><img class="m-ico-img" src="icons/sprite.png" alt=""><span>Órarend</span></button>
    <button type="button" class="m-tab" data-page="homework"><img class="m-ico-img" src="icons/note_text_p.png" alt=""><span>Házi</span></button>
    <button type="button" class="m-tab" id="moreBtn"><span class="m-ico">☰</span><span>Több</span></button>
  </nav>
  </div>
  <div id="overlay" class="n-overlay"></div>
  <script src="app.js"></script>
</body>
</html>
