
<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1976d2">

  <title>KRÁTA – Diák</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- =========================================================
       APP
  ========================================================== -->

  <div id="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

      <div class="brand">
        <div class="brand-logo">K</div>
        <div>
          <strong>KRÁTA</strong>
          <span>Diák</span>
        </div>
      </div>

      <nav class="navigation">

        <button class="nav-item active" data-page="home">
          <span class="nav-icon">⌂</span>
          <span>Kezdőlap</span>
        </button>

        <button class="nav-item" data-page="timetable">
          <span class="nav-icon">▦</span>
          <span>Órarend</span>
        </button>

        <button class="nav-item" data-page="grades">
          <span class="nav-icon">✓</span>
          <span>Jegyek</span>
        </button>

        <button class="nav-item" data-page="averages">
          <span class="nav-icon">◉</span>
          <span>Átlagok</span>
        </button>

        <button class="nav-item" data-page="omissions">
          <span class="nav-icon">!</span>
          <span>Mulasztások</span>
        </button>

        <button class="nav-item" data-page="homework">
          <span class="nav-icon">▤</span>
          <span>Házi feladatok</span>
        </button>

        <button class="nav-item" data-page="tests">
          <span class="nav-icon">✎</span>
          <span>Dolgozatok</span>
        </button>

        <button class="nav-item" data-page="notices">
          <span class="nav-icon">▣</span>
          <span>Faliújság</span>
        </button>

        <button class="nav-item" data-page="info">
          <span class="nav-icon">ⓘ</span>
          <span>Feljegyzések</span>
        </button>

        <button class="nav-item" data-page="dkt">
          <span class="nav-icon">◈</span>
          <span>DKT</span>
        </button>

      </nav>

      <div class="sidebar-bottom">
        <button class="nav-item" id="profileButton">
          <span class="nav-icon">●</span>
          <span>Profil</span>
        </button>

        <button class="nav-item logout-button" id="logoutButton">
          <span class="nav-icon">↪</span>
          <span>Kijelentkezés</span>
        </button>
      </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

      <!-- TOPBAR -->
      <header class="topbar">

        <button class="menu-button" id="menuButton" aria-label="Menü">
          ☰
        </button>

        <div class="page-title">
          <h1 id="pageTitle">Kezdőlap</h1>
          <span id="pageSubtitle">Üdvözöllek!</span>
        </div>

        <div class="topbar-right">

          <button class="icon-button" id="refreshButton" title="Frissítés">
            ↻
          </button>

          <div class="avatar" id="avatar">
            ?
          </div>

        </div>

      </header>


      <!-- CONTENT -->
      <section class="content" id="content">

        <div class="loading-container" id="initialLoading">
          <div class="spinner"></div>
          <p>Adatok betöltése...</p>
        </div>

      </section>

    </main>

  </div>


  <!-- TOAST -->
  <div class="toast" id="toast"></div>


  <!-- MOBILE OVERLAY -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>


  <script src="./app.js"></script>

</body>
</html>
