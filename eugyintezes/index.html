<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KRÁTA – e-Ügyintézés</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="e-topbar">
    <div class="brand"><img src="krata-logo.png" alt="KRÁTA" style="height:28px;vertical-align:middle;margin-right:8px"> <small style="display:inline">e-Ügyintézés · Kommunikáció</small></div>
    <div class="e-user">
      <span id="userLabel">—</span>
      <button type="button" id="logoutBtn">Kijelentkezés</button>
    </div>
  </div>

  <nav class="e-nav">
    <button type="button" class="e-nav-item active" data-folder="inbox">✉ Üzenetek</button>
    <button type="button" class="e-nav-item" data-folder="unread">Olvasatlan</button>
    <button type="button" class="e-nav-item" data-folder="compose">＋ Új üzenet</button>
    <button type="button" class="e-nav-item" data-folder="surveys">📋 Kérdőívek</button>
    <button type="button" class="e-nav-item" id="btnRefresh">Frissítés</button>
    <button type="button" class="e-nav-item" id="btnBackDiak">← Vissza a naplóba</button>
  </nav>

  <div class="e-body">
    <aside class="e-sidebar">
      <div class="e-side-label">Postafiók</div>
      <button type="button" class="e-nav-btn active" data-folder="inbox">
        Beérkezett <span class="e-badge" id="badgeInbox" hidden>0</span>
      </button>
      <button type="button" class="e-nav-btn" data-folder="unread">
        Olvasatlan <span class="e-badge" id="badgeUnread" hidden>0</span>
      </button>
      <button type="button" class="e-nav-btn" data-folder="compose">Új üzenet</button>
      <div class="e-side-label" style="margin-top:12px;">Ügyek</div>
      <button type="button" class="e-nav-btn" data-folder="surveys">Kérdőívek</button>
    </aside>

    <main class="e-main">
      <h1 class="e-page-title" id="pageTitle">Beérkezett üzenetek</h1>
      <div id="flash"></div>
      <div id="appRoot"></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
