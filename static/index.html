<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KRÁTA – Admin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Admin Basic Auth login -->
    <div id="loginScreen" class="login-screen" style="display:none;">
      <div class="login-card" style="max-width:420px;margin:40px auto;background:#fff;border:1px solid #c5d0dc;padding:28px;border-radius:4px;">
        <div style="font-weight:800;font-size:18px;color:#004578;margin-bottom:4px;">KRÁTA Admin</div>
        <div style="color:#5a6a7a;font-size:13px;margin-bottom:16px;">HTTP Basic – ADMIN_USERNAME / ADMIN_PASSWORD</div>
        <label style="display:block;font-weight:650;margin-bottom:4px;">Felhasználónév</label>
        <input id="adminUser" type="text" autocomplete="username" style="width:100%;padding:8px;margin-bottom:10px;border:1px solid #c5d0dc;" />
        <label style="display:block;font-weight:650;margin-bottom:4px;">Jelszó</label>
        <input id="adminPass" type="password" autocomplete="current-password" style="width:100%;padding:8px;margin-bottom:10px;border:1px solid #c5d0dc;" />
        <div id="loginError" class="n-msg n-msg-err" style="display:none;"></div>
        <button type="button" class="n-btn" id="adminLoginBtn" style="width:100%;">Belépés</button>
      </div>
    </div>

    <div id="appShell" style="display:none;">
      <header class="n-header">
        <div class="n-header-left">
          <button type="button" class="n-menu-toggle" id="menuBtn">☰</button>
          <div class="n-logo">KRÁTA</div>
          <div class="n-header-title">
            <span class="n-system">Adminisztráció</span>
            <span class="n-inst">Rendszerkezelés</span>
          </div>
        </div>
        <div class="n-header-right">
          <div class="n-user">
            <span class="n-user-name" id="adminLabel">admin</span>
            <span class="n-user-code">Basic Auth</span>
          </div>
          <button type="button" class="n-logout" id="logoutBtn">Kijelentkezés</button>
        </div>
      </header>

      <div class="n-body">
        <aside class="n-sidebar" id="sidebar">
          <div class="n-sidebar-label">Admin menü</div>
          <nav class="n-nav">
            <button class="n-nav-item active" data-page="dashboard">Áttekintés</button>
            <button class="n-nav-item" data-page="schools">Iskolák</button>
            <button class="n-nav-item" data-page="students">Tanulók</button>
            <button class="n-nav-item" data-page="studentForm">Új / szerkeszt diák</button>
            <button class="n-nav-item" data-page="teachers">Tanárok</button>
            <button class="n-nav-item" data-page="users">Felhasználók</button>
            <button class="n-nav-item" data-page="config">Konfig</button>
            <button class="n-nav-item" data-page="tools">Eszközök</button>
          </nav>
        </aside>

        <main class="n-main">
          <div class="n-breadcrumb">
            <span>KRÁTA Admin</span>
            <span class="n-bc-sep">›</span>
            <span id="bcPage">Áttekintés</span>
          </div>
          <h1 class="n-page-title" id="pageTitle">Áttekintés</h1>
          <div id="pageContent"></div>
        </main>
      </div>
    </div>

    <div id="overlay" class="n-overlay" style="display:none;"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
