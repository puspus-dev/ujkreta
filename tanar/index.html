<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KRÁTA – Tanári napló</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="bootMsg" class="boot-msg">Betöltés…</div>

    <header class="main-header">
      <button type="button" class="menu-toggle" id="menuBtn" aria-label="Menü">☰</button>
      <a class="brand" href="./"><img src="krata-logo.png" alt="KRÁTA" /></a>
      <div class="school-title"><h3 id="instName">KRÁTA</h3><span id="tanev"></span></div>
      <div class="usermenu">
        <span class="username" id="userName">—</span>
        <span class="usercode" id="userCode"></span>
        <a class="k-logout" href="https://puspus-dev.github.io/ujkreta/biztonsag/">2FA</a>
        <button type="button" class="k-logout" id="logoutBtn">Kijelentkezés</button>
      </div>
    </header>

    <nav class="main-menu" id="sidebar">
      <button type="button" class="n-nav-item active" data-page="dashboard"><span class="ico">🏠</span>Kezdőlap</button>
      <button type="button" class="n-nav-item" data-page="grade"><span class="ico">✅</span>Jegy beírása</button>

      <button type="button" class="n-nav-item" data-page="absences"><span class="ico">⏱</span>Mulasztások</button>
      <button type="button" class="n-nav-item" data-page="students"><span class="ico">👥</span>Tanulók</button>
      <button type="button" class="n-nav-item" data-page="timetable"><span class="ico">📅</span>Órarend</button>
      <button type="button" class="n-nav-item" data-page="homework"><span class="ico">📝</span>Házi feladatok</button>
      <button type="button" class="n-nav-item" data-page="profile"><span class="ico">👤</span>Profil</button>
    </nav>

    <main class="main-content">
      <div class="content-header"><h1 id="pageTitle">Kezdőlap</h1><span class="bc">KRÁTA › <span id="bcPage">Kezdőlap</span></span></div>
      <div id="pageContent"></div>
    </main>
  </div>
  <div id="overlay" class="n-overlay"></div>
  <script src="app.js"></script>
</body>
</html>
